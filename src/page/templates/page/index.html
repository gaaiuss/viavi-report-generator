{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIAVI Report Generator</title>
    <link rel="stylesheet" href="{% static 'assets/css/styles.css' %}">
    <link rel="icon" type="image/png" href="{% static 'assets/img/icon.png' %}">
</head>

<body>
    <section class="main-bg section">
        <div class="main-content">
            <div class="logo-content">
                <img class="logo-img" src="{% static 'assets/img/logo.png' %}" alt="">
            </div>
            <div class="text-content">
                <h1>Report Generator</h1>
            </div>
            <div class="button-content">
                <input class="button" type="file" id="fileInput" accept=".json" multiple/>
                <span class="span"></span>
                <button class="button gen-btn">Generate Report</button>
            </div>
            <div class="text-box"><p id="text"></p></div>
        </div>
    </section>
</body>

</html>
